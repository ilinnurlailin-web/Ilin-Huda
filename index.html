<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Of Nur & Miftahul</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- =========================
      COVER
========================== -->

<section id="cover">

<img src="cover.jpg" class="bg">

<div class="overlay">

<p class="title">
The Wedding Of
</p>

<h1>
Nur & Miftahul
</h1>

<p class="kepada">

Kepada Yth.

</p>

<div id="guest">

Tamu Undangan

</div>

<button onclick="openInvitation()">

💌 Open Invitation

</button>

</div>

<audio id="music"
src="musik.mp3"
loop>

</audio>

</section>

<!-- =========================
      CONTENT
========================== -->

<div id="content">

<!-- Opening -->

<section id="opening">

<img src="opening.jpg"
class="full">

</section>

<!-- Couple -->

<section>

<img src="couple.jpg"
class="full">

</section>

<!-- Groom -->

<section>

<img src="groom.jpg"
class="full">

</section>

<!-- Bride -->

<section>

<img src="bride.jpg"
class="full">

</section>

<!-- Akad -->

<section>

<img src="akad.jpg"
class="full">

</section>

<!-- Lokasi -->

<section id="lokasi">

    <img src="lokasi.jpg" class="full">

    <!-- Area Google Maps -->
    <a href="https://goo.gl/maps/AporenbSHTWGcBM4A?g_st=awb"
       target="_blank"
       class="maps-link"></a>

    <!-- Area RSVP -->
    <a href="https://forms.gle/gozAvAvXwhyNNtKg8"
       target="_blank"
       class="rsvp-link"></a>

</section>

<!-- Wedding Gift -->

<section id="gift">

    <img src="gift.jpg" class="full">

    <!-- Nomor rekening disembunyikan -->
    <span id="rek1" style="display:none;">1490012756500</span>
    <span id="rek2" style="display:none;">1647040931</span>

    <!-- Area transparan Bank Mandiri -->
    <button class="mandiri-copy"
            onclick="copyRekening('rek1')"></button>

    <!-- Area transparan Bank Kaltimtara -->
    <button class="kaltim-copy"
            onclick="copyRekening('rek2')"></button>

</section>

<!-- Penutup -->

<section>

<img src="penutup.jpg"
class="full">

</section>

<section>

<img src="pasangan.jpg"
class="full">

</section>

</div>

<script src="script.js"></script>

</body>

</html>
