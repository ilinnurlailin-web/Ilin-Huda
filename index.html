<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Of Nur & Miftahul</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- =========================
      COVER
========================== -->

<section id="cover">

<img src="cover.jpg" class="bg">

<div class="overlay">

<p class="kepada">

Kepada Yth.

</p>

<div id="guest">

Tamu Undangan

</div>

<button onclick="openInvitation()">

💌 Open Invitation

</button>

</div>

<audio id="music"
src="musik.mp3"
loop>

</audio>

</section>

<!-- =========================
      CONTENT
========================== -->

<div id="content">

<!-- Opening -->

<section id="opening">

<img src="opening.jpg"
class="full">

</section>

<!-- Couple -->

<section>

<img src="couple.jpg"
class="full">

</section>

<!-- Groom -->

<section>

<img src="groom.jpg"
class="full">

</section>

<!-- Bride -->

<section>

<img src="bride.jpg"
class="full">

</section>

<!-- Akad -->

<section>

<img src="akad.jpg"
class="full">

</section>

<!-- Lokasi -->

<section id="lokasi">

    <img src="lokasi.jpg" class="full">

    <div class="button-group">
        <a class="btn"
           href="https://goo.gl/maps/AporenbSHTWGcBM4A?g_st=awb"
           target="_blank">
            📍 Buka Google Maps
        </a>

        <a class="btn"
           href="https://forms.gle/gozAvAvXwhyNNtKg8"
           target="_blank">
            📝 Isi RSVP
        </a>
    </div>

</section>

<!-- Wedding Gift -->

<section id="gift">

    <img src="gift.jpg" class="full">

    <div class="rekening">

        <div class="bank">
            <h3>Bank Mandiri</h3>

            <p id="rek1">1490012756500</p>

            <p>a.n. Miftahul Huda Aprili</p>

            <button onclick="copyRekening('rek1')">
                📋 Copy Rekening
            </button>
        </div>

        <div class="bank">
            <h3>Bank Kaltimtara</h3>

            <p id="rek2">1647040931</p>

            <p>a.n. Nurlailin</p>

            <button onclick="copyRekening('rek2')">
                📋 Copy Rekening
            </button>
        </div>

    </div>

</section>

<!-- Penutup -->

<section>

<img src="penutup.jpg"
class="full">

</section>

<section>

<img src="pasangan.jpg"
class="full">

</section>

</div>

<script src="script.js"></script>
